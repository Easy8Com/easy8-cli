name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          APP_VERSION="${VERSION#v}"

          while read -r GOOS GOARCH; do
            if [ -z "$GOOS" ]; then
              continue
            fi

            BINARY="easy8-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              BINARY="${BINARY}.exe"
            fi

            echo "Building ${BINARY}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath \
              -ldflags "-s -w -X easy8-cli/internal/cli.Version=${APP_VERSION}" \
              -o "dist/${BINARY}" ./cmd/easy8
          done <<'EOF'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          windows arm64
          EOF

          (cd dist && sha256sum easy8-* > checksums.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
